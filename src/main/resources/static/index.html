
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rule Execution Verifier</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            color: #263238;
        }

        textarea {
            width: 100%;
            height: 220px;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        button {
            margin-top: 15px;
            padding: 12px 25px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        #result {
            margin-top: 25px;
        }

        .rule-result {
            margin-top: 20px;
            padding: 20px;
            background: #f1f5f9;
            border-radius: 8px;
        }

        .rule-result h3 {
            color: green;
            margin-top: 0;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Rule Execution Verifier</h1>

    <p>Paste your Auto Pause / Enable Slack logs below.</p>

    <textarea id="logs"
              placeholder="Paste Slack execution logs here..."></textarea>

    <br>

    <button id="verifyButton" onclick="verifyRules()">
        Verify Rules
    </button>

    <div id="result"></div>

</div>

<script>

    async function verifyRules() {

        const logs = document.getElementById("logs").value;
        const result = document.getElementById("result");
        const button = document.getElementById("verifyButton");

        if (!logs.trim()) {
            result.textContent = "Please paste the execution logs first.";
            return;
        }

        button.disabled = true;
        button.textContent = "Verifying...";
        result.innerHTML = "";

        try {

            const response = await fetch("/api/rules/verify", {
                method: "POST",
                headers: {
                    "Content-Type": "text/plain"
                },
                body: logs
            });

            if (!response.ok) {
                throw new Error("Server returned an error.");
            }

            const data = await response.json();

            displayResults(data);

        } catch (error) {

            result.textContent = "Error connecting to the server.";

        } finally {

            button.disabled = false;
            button.textContent = "Verify Rules";
        }
    }


    function displayResults(data) {

        const result = document.getElementById("result");

        if (data.length === 0) {
            result.textContent = "No valid rule logs found.";
            return;
        }

        let html = "";

        data.forEach(item => {

            const message = item.nonSuccessful === 0
                ? `Executions: ${item.total} and there are no failures in it.`
                : `Executions: ${item.total}, out of which ${item.nonSuccessful} were unsuccessful.`;

            html += `
    <div class="rule-result">
        <h3>The rule is completed</h3>
        <p><strong>Rule ID:</strong> ${item.ruleId}</p>
        <p><strong>Rule Type:</strong> ${item.ruleType}</p>
        <p><strong>Account Name:</strong> ${item.accountName}</p>
        <p><strong>${message}</strong></p>
    </div>
`;

        });

        result.innerHTML = html;
    }

</script>

</body>
</html>
